<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>陪伴小狗</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="陪伴小狗">
<meta name="theme-color" content="#FFD6E8">
<link rel="apple-touch-icon" href="assets/pwa-icon-192.png">
<link rel="icon" href="assets/pwa-icon-192.png">
<style>
:root{
  --bg-1:#FFF5F8; --bg-2:#FFE1EA;
  --rose:#F49BB7; --rose-deep:#E87CA0;
  --ink:#7C4256; --ink-soft:#A96880;
  --card:#FFFDFE; --shadow:rgba(214,120,148,.28);
  --hunger:#A9743F; --clean:#6FA8DC; --mood:#F08CB4; --energy:#9B7FD4; --health:#7FB87A;
  --bar-bg:rgba(124,66,86,.10);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",system-ui,sans-serif;
  color:var(--ink);background:var(--bg-1);
  display:flex;justify-content:center;
  overflow:hidden;
}
#app{
  width:100%;max-width:480px;height:100%;
  background:
    radial-gradient(120% 90% at 85% -10%, rgba(255,255,255,.9) 0%, rgba(255,255,255,0) 55%),
    radial-gradient(100% 80% at 10% 110%, rgba(255,209,224,.75) 0%, rgba(255,209,224,0) 55%),
    linear-gradient(160deg, var(--bg-1) 0%, var(--bg-2) 100%);
  position:relative;overflow:hidden;
}
.view{position:absolute;inset:0;display:none;flex-direction:column}
.view.on{display:flex}

/* ===== Logo 页 ===== */
#view-logo{justify-content:center;align-items:center;text-align:center;cursor:pointer}
#view-logo .logo-wrap{animation:logo-pop .9s cubic-bezier(.2,1.4,.4,1) both}
@keyframes logo-pop{from{opacity:0;transform:scale(.8) translateY(14px)}to{opacity:1;transform:none}}
#view-logo h1{
  font-size:44px;font-weight:800;letter-spacing:6px;color:var(--rose-deep);
  text-shadow:0 3px 14px rgba(232,124,160,.35);
}
#view-logo .sub{margin-top:14px;font-size:14px;letter-spacing:3px;color:var(--ink-soft)}
#view-logo .tap{margin-top:46px;font-size:12px;color:var(--ink-soft);letter-spacing:2px;animation:fade-blink 2.2s ease-in-out infinite}
@keyframes fade-blink{0%,100%{opacity:.45}50%{opacity:1}}
#view-logo .deco{position:absolute;border-radius:50%;background:rgba(255,255,255,.5)}
#view-logo .d1{width:120px;height:120px;top:12%;left:8%}
#view-logo .d2{width:80px;height:80px;top:20%;right:10%}
#view-logo .d3{width:150px;height:150px;bottom:10%;right:14%}
#view-logo .d4{width:70px;height:70px;bottom:22%;left:12%}

/* ===== 选狗页 ===== */
#view-select{padding:34px 18px 22px;overflow-y:auto}
#view-select h2{font-size:22px;font-weight:800;color:var(--rose-deep);text-align:center;letter-spacing:2px}
#view-select .tip{text-align:center;font-size:12px;color:var(--ink-soft);margin:8px 0 18px;letter-spacing:1px}
.dog-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.dog-card{
  background:rgba(255,253,254,.88);border:2px solid rgba(244,155,183,.45);
  border-radius:18px;padding:10px 6px 8px;text-align:center;cursor:pointer;
  transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease;
}
.dog-card:active{transform:scale(.96)}
.dog-card:hover{transform:translateY(-3px);border-color:var(--rose);box-shadow:0 8px 18px rgba(214,120,148,.2)}
.dog-card img{width:100%;aspect-ratio:1/1;object-fit:contain}
.dog-card .name{font-size:14px;font-weight:700;color:var(--ink);margin-top:2px}
.dog-card .growth{font-size:10px;color:var(--ink-soft)}

/* ===== 主界面 ===== */
#view-main{padding-top:8px}
.top-area{display:flex;align-items:center;gap:10px;padding:8px 14px 4px}
.avatar-col{flex:none;width:58px;text-align:center}
.avatar{width:52px;height:52px;border-radius:16px;background:rgba(255,255,255,.92);border:2px solid rgba(244,155,183,.55);
  box-shadow:0 3px 8px rgba(214,120,148,.2);display:flex;align-items:center;justify-content:center;overflow:hidden;margin:0 auto}
.avatar img{width:100%;height:100%;object-fit:contain}
.pet-name{font-size:10px;font-weight:700;color:var(--ink);margin-top:3px;letter-spacing:.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:58px}
.bars-col{flex:1;display:flex;flex-direction:column;gap:6px}
.bar-row{display:flex;align-items:center;gap:6px}
.bar-row .lbl{width:38px;font-size:10px;font-weight:700;color:var(--ink);flex:none}
.bar{flex:1;height:13px;border-radius:8px;background:var(--bar-bg);overflow:hidden;position:relative;border:1px solid rgba(255,255,255,.9)}
.bar .fill{height:100%;border-radius:8px;width:100%;transition:width .5s cubic-bezier(.3,1,.3,1);box-shadow:inset 0 0 0 1px rgba(255,255,255,.75)}
.bar-hunger .fill{background:linear-gradient(90deg,#C99A63,var(--hunger))}
.bar-clean .fill{background:linear-gradient(90deg,#9CC4EC,var(--clean))}
.bar-mood .fill{background:linear-gradient(90deg,#F7A9C8,var(--mood))}
.bar-energy .fill{background:linear-gradient(90deg,#BDA7E4,var(--energy))}
.bar-health .fill{background:linear-gradient(90deg,#A8D6A4,var(--health))}

/* 全部文字与数值：白色细描边 */
#view-logo h1,#view-logo .sub,#view-logo .tap,
#view-select h2,#view-select .tip,.dog-card .name,.dog-card .growth,
.view .lbl,.a-btn span,.bubble,.panel h3,.opt .t,.opt .d,.sleep-hint{
  text-shadow:1px 0 0 #fff,-1px 0 0 #fff,0 1px 0 #fff,0 -1px 0 #fff,
    1px 1px 0 #fff,-1px -1px 0 #fff,1px -1px 0 #fff,-1px 1px 0 #fff;
}

.scene{
  --w1:#A9C9E6; --w2:#C3DCEE; --w3:#D2E6F6;
  --f1:#F7E3BA; --f2:#F4DAA4; --f3:#F1D296;
  --dot:rgba(255,255,255,.5);
  --base1:#FAF6EC; --base2:#E9E0CD; --baseb:#D9CDB6;
  --floorline:rgba(196,160,96,.16);
  flex:1;position:relative;margin:2px 12px 0;border-radius:26px;overflow:hidden;
  background:linear-gradient(180deg,var(--f1) 0%,var(--f2) 46%,var(--f3) 100%);
  box-shadow:inset 0 2px 14px rgba(124,66,86,.12);
}
.scene[data-theme="pink"]{
  --w1:#F4B8D0; --w2:#F8CFDF; --w3:#FBE2EC;
  --f1:#F8E2E6; --f2:#F4D2DA; --f3:#EFC4CE;
  --dot:rgba(255,255,255,.6);
  --base1:#FDF6F7; --base2:#F0DDE2; --baseb:#E0C2CB;
  --floorline:rgba(210,140,160,.14);
}
.scene[data-theme="grass"]{
  --w1:#B7D8A8; --w2:#CBE4BC; --w3:#DCEED0;
  --f1:#CBE5B2; --f2:#BCDA9E; --f3:#AECF8F;
  --dot:rgba(255,255,255,.55);
  --base1:#F4F9EE; --base2:#DDE8CD; --baseb:#C4D4AC;
  --floorline:rgba(120,160,90,.18);
}
.scene[data-theme="dusk"]{
  --w1:#F3C4A5; --w2:#F8D6BC; --w3:#FCE5D3;
  --f1:#F6D3AC; --f2:#F0C192; --f3:#E8AE7C;
  --dot:rgba(255,255,255,.55);
  --base1:#FDF3E8; --base2:#EFDDC6; --baseb:#DFC5A4;
  --floorline:rgba(190,120,60,.18);
}
.scene[data-theme="starry"]{
  --w1:#18234A; --w2:#1F2C5C; --w3:#283772;
  --f1:#454A6B; --f2:#3D4160; --f3:#363A55;
  --dot:rgba(255,255,255,.75);
  --base1:#4A5073; --base2:#3E4464; --baseb:#2C3150;
  --floorline:rgba(150,160,240,.14);
}
.star{position:absolute;border-radius:50%;background:#fff;
  box-shadow:0 0 4px rgba(255,255,255,.95),0 0 12px rgba(255,255,255,.55);
  animation:twinkle ease-in-out infinite alternate}
@keyframes twinkle{from{opacity:.2;transform:scale(.75)}to{opacity:1;transform:scale(1.2)}}
.scene .wall{position:absolute;left:0;right:0;top:0;height:52%;
  background:
    radial-gradient(120% 95% at 50% -5%, rgba(255,255,255,.55) 0%, rgba(255,255,255,0) 60%),
    linear-gradient(180deg,var(--w1) 0%,var(--w2) 55%,var(--w3) 100%);
}
.scene .wall::after{content:"";position:absolute;left:0;right:0;bottom:-8px;height:18px;
  background:linear-gradient(180deg,var(--base1) 0%,var(--base2) 100%);
  border-bottom:3px solid var(--baseb)}
.scene .wall .dot{position:absolute;width:9px;height:9px;border-radius:50%;background:var(--dot)}
.scene .floor{position:absolute;left:0;right:0;bottom:0;height:48%;
  background:
    repeating-linear-gradient(90deg, var(--floorline) 0 2px, rgba(196,160,96,0) 2px 66px),
    radial-gradient(95% 130% at 50% 100%, rgba(255,255,255,.38) 0%, rgba(255,255,255,0) 60%)}
.bubble{
  position:absolute;left:50%;top:10px;transform:translateX(-50%);
  background:var(--card);border:1.5px solid rgba(244,155,183,.55);border-radius:16px;
  padding:8px 14px;font-size:13px;line-height:1.55;color:var(--ink);
  box-shadow:0 4px 14px rgba(214,120,148,.16);
  max-width:86%;text-align:center;z-index:6;
  opacity:0;transform:translate(-50%,6px) scale(.96);
  transition:opacity .25s ease, transform .25s ease;
}
.bubble.show{opacity:1;transform:translate(-50%,0) scale(1)}
.bubble::after{content:"";position:absolute;left:50%;bottom:-6px;width:11px;height:11px;background:var(--card);
  border-right:1.5px solid rgba(244,155,183,.55);border-bottom:1.5px solid rgba(244,155,183,.55);
  transform:translateX(-50%) rotate(45deg)}
.bubble .w{color:var(--rose-deep);font-weight:800}

.dog-wrap{position:absolute;left:0;top:0;z-index:4;will-change:transform}
.dog-box{position:relative;width:min(31vw,146px);aspect-ratio:1/1;will-change:transform}
.dog-box.breathe{animation:breathe 3.2s ease-in-out infinite alternate}
.dog-box.breathe-soft{animation:breathe-soft 4.8s ease-in-out infinite alternate}
.dog-box img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;transition:opacity .2s ease, transform .2s ease}
.dog-box img.hidden{opacity:0}
.dog-box img.active{opacity:1}
.dog-box img.jump-air{transform:translateY(-42px) scale(1.02)}
@keyframes breathe{from{transform:translateY(0) scale(1)}to{transform:translateY(-7px) scale(1.02)}}
@keyframes breathe-soft{from{transform:translateY(0) scale(1)}to{transform:translateY(-4px) scale(1.015)}}
.ground-shadow{position:absolute;left:50%;bottom:1px;transform:translateX(-50%);
  width:70%;height:15px;border-radius:50%;
  background:radial-gradient(ellipse at center, rgba(150,108,66,.32) 0%, rgba(150,108,66,0) 68%);
  transition:transform .3s ease, opacity .3s ease}
.dog-box.air ~ .ground-shadow{transform:translateX(-50%) scale(.75);opacity:.5}

/* 球与玩具 */
.toy{position:absolute;z-index:5;touch-action:none;will-change:transform}
.ball{
  width:56px;height:56px;border-radius:50%;
  background:radial-gradient(circle at 32% 30%, #FFE9C9 0%, #F7B267 40%, #E88B3C 100%);
  box-shadow:inset -4px -6px 10px rgba(180,90,20,.35), 0 6px 12px rgba(180,110,40,.25);
  cursor:grab;
}
.ball:active{cursor:grabbing}
.ball-shadow{position:absolute;width:34px;height:12px;border-radius:50%;background:rgba(140,90,60,.3);
  transform:translate(-50%,-50%);transition:opacity .15s ease, transform .15s ease;z-index:4;pointer-events:none}
.stick{
  width:76px;height:22px;border-radius:10px;
  background:linear-gradient(180deg,#E7A15C 0%,#C97B3D 100%);
  box-shadow:inset 0 2px 3px rgba(255,255,255,.4), 0 5px 10px rgba(160,100,50,.3);
  transform-origin:center;
}
.toy-drop{animation:toy-drop .55s cubic-bezier(.3,1.4,.4,1) both}
@keyframes toy-drop{
  0%{transform:translateY(-240px) scale(.5);opacity:0}
  60%{transform:translateY(0) scale(1.08)}
  75%{transform:translateY(-26px) scale(.97)}
  100%{transform:translateY(0) scale(1);opacity:1}
}

/* 底部操作栏 */
.action-bar{display:flex;gap:10px;padding:10px 14px 16px}
.a-btn{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  background:rgba(255,253,254,.92);border:1.5px solid rgba(244,155,183,.55);
  border-radius:16px;padding:9px 4px 7px;cursor:pointer;
  transition:transform .15s ease, box-shadow .18s ease;
}
.a-btn:active{transform:scale(.94)}
.a-btn:hover{box-shadow:0 6px 14px rgba(214,120,148,.2)}
.a-btn svg{width:22px;height:22px;color:var(--rose-deep)}
.a-btn span{font-size:12px;font-weight:700;color:var(--ink)}

/* ===== 取名页 ===== */
#view-name{justify-content:center;align-items:center;padding:30px}
.name-box{width:100%;max-width:340px;text-align:center;background:rgba(255,253,254,.92);
  border:2px solid rgba(244,155,183,.45);border-radius:26px;padding:26px 22px 24px;
  box-shadow:0 10px 26px rgba(214,120,148,.18)}
#view-name h2{font-size:20px;font-weight:800;color:var(--rose-deep);letter-spacing:2px}
.name-preview{width:150px;height:150px;margin:16px auto 14px;border-radius:22px;background:#fff;
  border:2px solid rgba(244,155,183,.4);display:flex;align-items:center;justify-content:center;overflow:hidden}
.name-preview img{width:100%;height:100%;object-fit:contain}
#nameInput{width:100%;height:44px;border:2px solid rgba(244,155,183,.55);border-radius:14px;
  background:#FFF7FA;font-size:16px;text-align:center;color:var(--ink);outline:none;font-family:inherit}
#nameInput:focus{border-color:var(--rose)}
.name-btn{width:100%;height:46px;margin-top:14px;border:none;border-radius:16px;
  background:linear-gradient(135deg,#F49BB7,#E87CA0);color:#fff;font-size:16px;font-weight:800;
  letter-spacing:3px;cursor:pointer;box-shadow:0 6px 16px rgba(232,124,160,.35)}
.name-btn:active{transform:scale(.96)}

/* ===== 设置面板 ===== */
.set-row{display:flex;align-items:center;gap:10px;margin-top:16px}

/* ===== 对话面板 ===== */
.chat-panel{max-height:68vh;display:flex;flex-direction:column}
.chat-log{flex:1;overflow-y:auto;margin-top:12px;display:flex;flex-direction:column;gap:8px;min-height:120px;max-height:36vh}
.chat-msg{max-width:78%;padding:8px 12px;border-radius:14px;font-size:13px;line-height:1.55;word-break:break-word}
.chat-msg.me{align-self:flex-start;background:#F1E4F5;color:var(--ink);border-bottom-left-radius:4px}
.chat-msg.dog{align-self:flex-end;background:#FFF1F5;border:1.5px solid rgba(244,155,183,.5);color:var(--ink);border-bottom-right-radius:4px}
.chat-msg .w{font-weight:800;color:var(--rose-deep)}
.chat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px;
  max-height:26vh;overflow-y:auto;padding:2px}
.chat-grid button{background:#FFF4F8;border:1.5px solid rgba(244,155,183,.45);border-radius:14px;
  padding:12px 10px;font-size:13px;font-weight:700;color:var(--ink);cursor:pointer;
  transition:transform .12s ease, background .16s ease}
.chat-grid button:active{transform:scale(.95);background:#FFE7EF}
.set-lbl{width:64px;font-size:13px;font-weight:700;color:var(--ink);flex:none}
#volSlider{flex:1;-webkit-appearance:none;appearance:none;height:6px;border-radius:4px;
  background:linear-gradient(90deg,#F49BB7,var(--rose));outline:none}
#volSlider::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;
  background:#fff;border:2px solid var(--rose-deep);cursor:pointer;box-shadow:0 2px 6px rgba(214,120,148,.3)}
.set-val{width:44px;font-size:12px;color:var(--ink-soft);font-weight:700;text-align:right}
.theme-row{flex:1;display:flex;gap:8px}
.theme-swatch{width:34px;height:34px;border-radius:12px;cursor:pointer;border:2px solid rgba(124,66,86,.18);
  position:relative;transition:transform .15s ease, border-color .15s ease}
.theme-swatch.on{border-color:var(--rose-deep);transform:scale(1.08)}
.theme-swatch.on::after{content:"✓";position:absolute;right:3px;bottom:1px;font-size:11px;color:#fff;
  font-weight:800;text-shadow:0 0 2px rgba(0,0,0,.4)}
.reset-row{justify-content:center;margin-top:20px;border-top:1px dashed rgba(244,155,183,.4);padding-top:16px}
.reset-btn{width:100%;height:44px;border:2px solid #E87CA0;border-radius:14px;background:#FFF4F8;
  color:var(--rose-deep);font-size:14px;font-weight:800;letter-spacing:1px;cursor:pointer}
.reset-btn:active{transform:scale(.97)}

/* 弹层 */
.mask{position:absolute;inset:0;background:rgba(124,66,86,.28);z-index:20;display:none;justify-content:center;align-items:flex-end}
.mask.on{display:flex}
.panel{background:var(--card);width:100%;border-radius:24px 24px 0 0;padding:18px 18px 26px;animation:slide-up .28s cubic-bezier(.3,1,.3,1) both}
@keyframes slide-up{from{transform:translateY(60px);opacity:.6}to{transform:none;opacity:1}}
.panel h3{font-size:17px;font-weight:800;color:var(--rose-deep);text-align:center;margin-bottom:14px}
.panel .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.opt{display:flex;flex-direction:column;align-items:center;gap:5px;background:#FFF4F8;
  border:1.5px solid rgba(244,155,183,.4);border-radius:14px;padding:10px 4px 8px;cursor:pointer;
  transition:transform .15s ease, background .18s ease}
.opt:active{transform:scale(.93);background:#FFE7EF}
.opt .ico{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:18px;font-weight:800;color:#fff}
.opt .t{font-size:11.5px;font-weight:700;color:var(--ink)}
.opt .d{font-size:10px;color:var(--ink-soft);text-align:center;line-height:1.3}
.ico-bone{background:#C99A63}.ico-food{background:#B98A4E}.ico-can{background:#A9A2C9}.ico-snack{background:#E8B07A}
.ico-soap{background:#8FC1E8}.ico-soap2{background:#F0A8C0}.ico-soap3{background:#A9C48F}.ico-soap4{background:#E8C98A}
.ico-ball{background:#F0A45C}.ico-stick{background:#C97B3D}
.panel .close{position:absolute;top:12px;right:16px;font-size:22px;color:var(--ink-soft);cursor:pointer;line-height:1}

/* 信弹窗（兑换码） */
.letter-mask{align-items:center}
.letter-panel{width:86%;max-width:340px;border-radius:20px;padding:24px 22px 28px;text-align:center;box-shadow:0 10px 32px rgba(124,66,86,.25)}
.letter-body{font-size:14px;line-height:2.05;color:var(--ink);white-space:pre-line;text-align:left;margin-top:4px}
.letter-sign{display:block;text-align:center;font-weight:800;color:var(--rose-deep);font-size:16px;margin-top:14px}
.letter-divider{display:block;text-align:center;color:var(--ink-soft);font-size:13px;margin-top:6px;letter-spacing:1px}

/* BGM */
.bgm-btn{position:absolute;top:8px;right:10px;z-index:10;width:34px;height:34px;border-radius:50%;
  background:rgba(255,253,254,.85);border:1.5px solid rgba(244,155,183,.5);display:flex;align-items:center;justify-content:center;cursor:pointer}
.bgm-btn svg{width:17px;height:17px;color:var(--rose-deep)}
.sleep-hint{position:absolute;bottom:12%;left:0;right:0;text-align:center;font-size:12px;color:var(--ink-soft);z-index:6}
@media (prefers-reduced-motion: reduce){
  .dog-box.breathe,.dog-box.breathe-soft,.dog-box img{animation:none;transition:none}
}
</style>
</head>
<body>
<div id="app">

  <!-- ===== Logo 页 ===== -->
  <div class="view" id="view-logo">
    <div class="deco d1"></div><div class="deco d2"></div><div class="deco d3"></div><div class="deco d4"></div>
    <div class="logo-wrap">
      <h1>陪伴小狗</h1>
      <div class="sub">领取你的小狗</div>
    </div>
    <div class="tap">轻触屏幕，开始陪伴</div>
  </div>

  <!-- ===== 选狗页 ===== -->
  <div class="view" id="view-select">
    <h2>选择你的小狗</h2>
    <div class="tip">它会一直在这里等你回来</div>
    <div class="dog-grid" id="dogGrid"></div>
  </div>

  <!-- ===== 取名页 ===== -->
  <div class="view" id="view-name">
    <div class="name-box">
      <h2>给它取个名字</h2>
      <div class="name-preview"><img id="nameDogImg" alt="所选小狗"></div>
      <input id="nameInput" maxlength="8" placeholder="输入小狗的名字">
      <button class="name-btn" id="nameOk">开始陪伴</button>
    </div>

function clearTimers(){
  state.timers.forEach(function(t){ clearInterval(t); clearTimeout(t); });

}

/* ---------- 存档 ---------- */
function save(){
  S.stats = {hunger:stats.hunger, clean:stats.clean, mood:stats.mood, energy:stats.energy, health:stats.health};
  S.lastSeen = Date.now(); S.dog = stats.dog;
  S.ageDays = S.ageDays || 0;
  /* 记录小狗当前位置（比例），切后台/刷新后可恢复原位 */
  try{
    var s = sceneSize();
    if(s && s.w > 0){
      S.pos = {xr: move.x / s.w, yr: move.groundY / s.h, facing: move.facing};
    }
  }catch(e){}
  try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }catch(e){}
}
function load(){
  try{
    var raw = localStorage.getItem(LS_KEY);
    if(raw){
      var d = JSON.parse(raw);
      if(d && d.stats){
        var now = Date.now();
        var elapsed = (now - (d.lastSeen||now)) / 1000;
        stats.hunger = clamp(d.stats.hunger - elapsed*DECAY_PER_SEC, 0, 100);
        stats.clean  = clamp(d.stats.clean  - elapsed*DECAY_PER_SEC, 0, 100);
        stats.mood   = clamp(d.stats.mood   - elapsed*DECAY_PER_SEC, 0, 100);
        /* 离线时小狗默认在休息：精力缓慢恢复（其他数值照常随时间消耗） */

        stats.health = clamp(d.stats.health, 0, 100);
        stats.dog = d.dog || "samoyed";
        S.dog = stats.dog;              /* 修复：存档中同步恢复所选小狗，避免刷新后被默认值覆盖 */

        S.theme = d.theme || "sky";
        S.firstSeen = false;
        S.pos = d.pos || null;          /* 恢复小狗位置存档 */

];
function mergeNewLines(){
  Object.keys(NEWLINES).forEach(function(dog){
    Object.keys(NEWLINES[dog]).forEach(function(k){
      var base = PERSONA[dog][k];
      if(typeof base === "string") base = null;   // 避免与 trait 的 name 字符串字段冲突
      PERSONA[dog][k] = (base || []).concat(NEWLINES[dog][k]);
    });
  });
}
var chatReplyLock = 0;
function initChat(){
  $("btnChat").addEventListener("click", function(){ openMask("maskChat"); });
  var grid = $("chatGrid");
  CHAT_BUTTONS.forEach(function(b){
    var s = document.createElement("button");
    s.textContent = b.label;
    s.addEventListener("click", function(){
      var p = PERSONA[stats.dog] || PERSONA.samoyed;
      var pool = p[b.key] || p.fallback;
      var thought = pool[Math.floor(Math.random()*pool.length)];
      var mood = moodExpr();
      var r = { bark: barkFor(mood), thought: thought };
      addChat("me", b.q);
      addChat("dog", r.bark + " " + r.thought);
      chatReplyLock = Date.now() + 4200;   // 回复气泡显示期间，自动场景台词不覆盖
      say(r.bark, r.thought, 4200);
      postActionIdle();
    });
    grid.appendChild(s);
  });
  var log = $("chatLog");
  function addChat(who, text){
    var d = document.createElement("div");
    d.className = "chat-msg " + (who === "me" ? "me" : "dog");
    var inner;
    if(who === "me"){ inner = document.createElement("span"); inner.textContent = text; }
    else {
      inner = document.createElement("span");
      var idx = text.indexOf("（");
      if(idx > 0){ var w = document.createElement("span"); w.className = "w"; w.textContent = text.slice(0, idx); inner.appendChild(w); inner.appendChild(document.createTextNode(text.slice(idx))); }
      else inner.textContent = text;
    }
    d.appendChild(inner);
    log.appendChild(d);
    while(log.children.length > 7) log.removeChild(log.firstChild);
    log.scrollTop = log.scrollHeight;
  }
}

    i = useRun ? ((i % 3) + 1) : ((i % 2) + 1);   // 散步两帧循环 walk-1↔walk-2，兜底奔跑仍三帧
    showFrames(useRun ? ["f-run-" + i] : ["f-walk-" + i]);

/* ---------- 自主活动（八向散步 / 小跑，按速度切换动画；散步·趴下·睡觉均为待机事件） ---------- */
var move = { on:false, x:0, y:0, tx:0, ty:0, groundY:0, speed:0, mode:"walk", facing:1, raf:0, lastT:0 };
var ROAM = { minX:0.08, maxX:0.92, minG:0.53, maxG:0.92, walkSpd:60, runSpd:165 };
var SLEEP_HOUR_START = 23, SLEEP_HOUR_END = 5, WAKE_GRACE = 90000;
var OFFLINE_REGEN = 0.02;   // 离线休息时精力恢复速率（/秒），比趴下待机慢，8 小时约回满

function wrapSize(){
  var r = $("dogBox").getBoundingClientRect();
  return {w:r.width, h:r.height};
}
function dogPos(){
  var s = sceneSize();
  var r = $("dogWrap").getBoundingClientRect();
  return {x: r.left - s.left + r.width/2, y: r.top - s.top + r.height/2};
}
function setWrap(x, y){
  $("dogWrap").style.transform = "translate(" + x + "px," + y + "px) scaleX(" + move.facing + ")";
  /* 对话框始终跟随小狗，悬在其头顶 */
  var b = $("bubble");
  var bw = $("dogBox").getBoundingClientRect().width || 120;
  var s = sceneSize();
  var bx = clamp(x + bw/2, 90, Math.max(90, s.w - 90));
  var by = Math.max(8, y - 78);
  b.style.left = bx + "px";
  b.style.top = by + "px";
}
function startMove(cx, gy, mode){
  var w = wrapSize(), s = sceneSize();
  gy = clamp(gy, s.h*ROAM.minG, s.h*ROAM.maxG);
  move.groundY = gy;
  var tx = clamp(cx - w.w/2, 0, Math.max(0, s.w - w.w));
  var ty = gy - w.h;
  // 起点为当前位置（由 initPos/上一次移动维护），目标是 tx/ty——逐步走过去而不是瞬移
  move.tx = tx; move.ty = ty;
  move.mode = mode;
  move.speed = mode === "run" ? ROAM.runSpd : ROAM.walkSpd;
  move.facing = (cx >= (move.x + w.w/2)) ? -1 : 1;   // 素材默认头朝左：向右走时翻转朝右
  move.on = true;
  move.lastT = performance.now();   // 每段移动都以当前时刻为基准，避免沿用旧时间戳导致步长失真
  setWrap(move.x, move.y);
  // 移动即切换对应动画：跑用奔跑帧、走用散步帧，避免趴着/跳跃等姿态"滑行"
  if(mode === "run") doRun(); else doWalk();
  if(!move.raf){ move.raf = requestAnimationFrame(moveTick); }
}
function stopMove(){
  move.on = false;
  if(move.raf){ cancelAnimationFrame(move.raf); move.raf = 0; }
  if(state.act === "run" || state.act === "walk") doIdle(true);
}
function moveTick(now){
  move.raf = 0;
  var dt = Math.min((now - move.lastT)/1000, .05);
  move.lastT = now;
  if(move.on){
    var dx = move.tx - move.x, dy = move.ty - move.y;
    var dist = Math.sqrt(dx*dx + dy*dy);
    var step = move.speed * dt;
    if(dist <= step || dist === 0){
      move.x = move.tx; move.y = move.ty;
      move.on = false;
      if(state.act === "walk" || state.act === "run") doIdle(true);   // 到达即静止：避免"贴图在走但位置已停"的踏步态
    } else {
      move.x += dx/dist*step;
      move.y += dy/dist*step;
      if(Math.abs(dx) > 1) move.facing = dx > 0 ? -1 : 1;   // 向右走朝右（翻转），向左走朝左
    }
    setWrap(move.x, move.y);
    if(state.act === "idle" || state.act === "run" || state.act === "walk"){
      var want = move.mode === "run" ? "run" : "walk";
      if(state.act !== want){ if(want === "run") doRun(); else doWalk(); }
    }
    if(!move.on){
      if(ball.mode === "chase"){ chaseKnock(); }
      else idleAfterArrive();
    }
  }
  if(move.on) move.raf = requestAnimationFrame(moveTick);
}
function scheduleRoam(delay, force){
  if(state.roamT) clearTimeout(state.roamT);
  state.roamT = setTimeout(function(){
    /* 任一跳过调度的场景都先清掉走/跑残留动画，避免原地踏步（贴图走、位置停） */
    if(state.sleeping){ if(state.act === "walk" || state.act === "run") doIdle(true); return; }
    if(!force && state.act !== "idle") return;
    if($("toyLayer").children.length){ if(state.act === "walk" || state.act === "run") doIdle(true); return; }  // 有玩具在玩时不自走
    if(document.querySelector(".mask.on")){ if(state.act === "walk" || state.act === "run") doIdle(true); return; } // 弹层打开时不打扰
    var s = sceneSize(), w = wrapSize();
    /* 触边自动转向（左右 + 上下）：当前位置靠近哪一侧，下一个目标点就强制偏向反方向，避免一直冲着一个方向撞 */
    var cxc = (move.x + w.w/2) / s.w;   // 当前中心横向比例 0~1
    var gyc = move.groundY / s.h;       // 当前深度比例 0~1（越小越靠上/远处）
    var minX = cxc < 0.35 ? 0.40 : ROAM.minX;              // 靠近左缘 → 目标明显向右
    var maxX = cxc > 0.65 ? 0.60 : ROAM.maxX;              // 靠近右缘 → 目标明显向左
    minX = Math.max(minX, 0.18);                           // 目标永远离墙 ≥18%，不走向墙根
    maxX = Math.min(maxX, 0.82);
    var minG = gyc < 0.62 ? Math.max(ROAM.minG, gyc + 0.08) : ROAM.minG;  // 靠近上缘 → 强制往下走
    var maxG = gyc > 0.78 ? Math.min(ROAM.maxG, gyc - 0.08) : ROAM.maxG;  // 靠近下缘 → 强制往上走
    var cx = s.w * (minX + Math.random()*(maxX - minX));
    var gy = s.h * (minG + Math.random()*(maxG - minG));
    /* 防原地踏步：目标点距当前位置太近时，直接跳到对侧区域，保证每段都有明显移动 */
    var cxp = move.x + w.w/2, gyp = move.groundY;
    var MIN_DIST = s.w * 0.10;   // 最小移动距离：屏幕宽 10%
    var d = Math.sqrt(Math.pow(cx - cxp, 2) + Math.pow(gy - gyp, 2));
    if(d < MIN_DIST){
      var toRight = cxp < s.w * 0.5;
      cx = s.w * (toRight ? 0.55 + Math.random()*0.27 : 0.18 + Math.random()*0.27);   // 对侧中段，不贴墙
      gy = s.h * (0.55 + Math.random()*0.30);
      d = Math.sqrt(Math.pow(cx - cxp, 2) + Math.pow(gy - gyp, 2));
    }
    var mode = (Math.random() < 0.22 && d > s.w*0.2) ? "run" : "walk";
    startMove(cx, gy, mode);
  }, delay == null ? 600 + Math.random()*2200 : delay);
}
function idleAfterArrive(){
  var e = stats.energy;
  /* 精力见底：一直趴着，直到精力恢复到 50% 以上再继续活动 */
  if(e < 10){ lieRestUntil(50); return; }
  /* 精力偏低：大幅提高趴下休息概率，休息更久以回精力 */
  if(e < 30){
    if(Math.random() < 0.45){
      lieThenRoam(10000 + Math.random()*10000);  // 趴下休息 10-20 秒
    } else {
      doIdle(true);
      scheduleRoam(1000 + Math.random()*1500);
    }
    return;
  }
  /* 精力正常：默认直接续走下一点（掉头不先进待机）；偶尔短暂停歇再走（走走停停） */
  if(Math.random() < 0.12){
    if(Math.random() < 0.2){
      lieThenRoam(3000 + Math.random()*3000);   // 偶尔趴下休息 3-6 秒
    } else {
      doIdle(true);
      scheduleRoam(1500 + Math.random()*2500);  // 站立小休 1.5-4 秒
    }
  } else {
    scheduleRoam(20 + Math.random()*50, true);  // 不掉头不进待机：极短缓冲后直接续走（目标已强制偏向反方向）
  }
}
/* 用户交互结束后随机进入某一待机动作，随后恢复走动：原地待机严格控制在 3-5 秒（精力正常时） */
function postActionIdle(){
  var e = stats.energy;
  /* 精力见底：一直趴着，直到精力恢复到 50% 以上再继续活动 */
  if(e < 10){ lieRestUntil(50); return; }
  /* 精力偏低：提高趴下休息概率，休息更久以回精力 */
  if(e < 30){
    if(Math.random() < 0.45){
      lieThenRoam(10000 + Math.random()*10000);  // 趴下休息 10-20 秒
    } else {
      doIdle(true);
      scheduleRoam(3000 + Math.random()*2000);   // 站立小休 3-5 秒
    }
    return;
  }
  if(Math.random() < 0.2){
    lieThenRoam(3000 + Math.random()*2000);   // 低概率趴下，3-5 秒后起身
  } else {
    doIdle(true);
    scheduleRoam(3000 + Math.random()*2000);  // 站立小休 3-5 秒后继续走
  }
}
function lieThenRoam(dur){
  stopMove();
  doLie();
  if(state.roamT) clearTimeout(state.roamT);
  state.roamT = setTimeout(function(){
    if(state.sleeping) return;
    if(state.act === "lie"){ doIdle(true); scheduleRoam(200 + Math.random()*600); }
  }, dur);
}
/* 精力见底：一直趴着休息，直到精力恢复到 target 以上才恢复活动 */
function lieRestUntil(target){
  stopMove();
  doLie();
  if(state.roamT) clearTimeout(state.roamT);
  var iv = setInterval(function(){
    if(state.sleeping) return;                    // 夜间入睡后由睡眠恢复接管
    if(stats.energy >= target){
      clearInterval(iv);
      if(state.act === "lie"){ doIdle(true); scheduleRoam(300 + Math.random()*500); }
    }
  }, 3000);
  state.timers.push(iv);
}
function initPos(){
  var s = sceneSize(), w = wrapSize();
  /* 优先恢复存档位置（比例），避免刷新/切后台后重置回初始点 */
  if(S.pos && S.pos.xr != null && S.pos.yr != null){
    move.groundY = clamp(S.pos.yr * s.h, s.h * ROAM.minG, s.h * ROAM.maxG);
    move.x = clamp(S.pos.xr * s.w - w.w/2, 0, Math.max(0, s.w - w.w));
    move.y = move.groundY - w.h;
    move.facing = S.pos.facing || 1;
    setWrap(move.x, move.y);
    return;
  }
  move.groundY = s.h * 0.60;
  move.x = s.w/2 - w.w/2;
  move.y = move.groundY - w.h;
  move.facing = 1;
  setWrap(move.x, move.y);
}

/* ---------- 自动作息：每天 23:00 自动入睡，5:00 自动醒来；点击/互动可唤醒，唤醒后无操作自动续睡 ---------- */
function isNightNow(){
  var h = new Date().getHours();
  return h >= SLEEP_HOUR_START || h < SLEEP_HOUR_END;
}
function enterSleep(){
  if(state.sleeping) return;
  state.sleeping = true;
  stopMove();
  if(state.roamT){ clearTimeout(state.roamT); state.roamT = null; }
  doSleep();
  $("sleepHint").style.display = "block";
  $("sleepHint").textContent = "轻触画面唤醒";
  $("scene").addEventListener("click", wakeOnce);
}
function autoWake(){
  if(!state.sleeping) return;
  state.sleeping = false;
  $("sleepHint").style.display = "none";
  $("scene").removeEventListener("click", wakeOnce);
  stopMove();
  doIdle(true);
  scheduleRoam(1200);
}
function wakeUp(){
  if(!state.sleeping) return;
  state.wakeGrace = Date.now() + WAKE_GRACE;
  autoWake();
  aiSay("wake");
  postActionIdle();
}
function wakeOnce(){
  wakeUp();
}
function checkAutoSleep(){
  if(!$("view-main").classList.contains("on")) return; // 非主界面不自动睡
  if(document.querySelector(".mask.on")) return;        // 弹层打开时不自动睡
  if($("toyLayer").children.length) return;             // 玩玩具中不自动睡
  var night = isNightNow();
  if(night && !state.sleeping && (state.act === "idle" || state.act === "lie") && Date.now() > (state.wakeGrace || 0)){
    enterSleep();
  } else if(!night && state.sleeping){
    autoWake();
  }
}

/* ---------- 玩耍：球 ---------- */
var ball = { el:null, x:0, y:0, groundY:0, size:56, mode:"rally", busy:false, knockN:0, settleT:null };

function sceneSize(){
  var r = $("scene").getBoundingClientRect();
  return {w:r.width, h:r.height, left:r.left, top:r.top};
}
/* dogPos 已移至自主活动模块（返回小狗实时位置） */
function ballScale(y){
  var s = sceneSize();
  return 0.6 + 0.4 * clamp((s.h - y) / s.h, 0, 1);   // 越靠近底部（用户侧）越大
}
function applyBall(){
  var sc = ballScale(ball.y);
  ball.el.style.width = ball.size * sc + "px";
  ball.el.style.height = ball.size * sc + "px";
  ball.el.style.left = (ball.x - ball.size * sc / 2) + "px";
  ball.el.style.top = (ball.y - ball.size * sc / 2) + "px";
  var sh = ball.el.querySelector(".ball-shadow");
  var hf = clamp((ball.groundY - ball.y) / (ball.groundY * 0.5), 0, 1);  // 离地比例
  sh.style.left = (ball.size * sc / 2) + "px";
  sh.style.top = (ball.groundY - ball.y) + (ball.size * sc / 2) + "px";
  sh.style.opacity = 1 - hf * 0.7;
  sh.style.transform = "translate(-50%,-50%) scale(" + (1 - hf * 0.4) + ")";
}
function flyBall(to, dur, cb){
  var from = {x: ball.x, y: ball.y};
  var peak = Math.min(from.y, to.y) - Math.abs(to.x - from.x) * 0.28;
  var t0 = performance.now();
  function step(now){
    var p = clamp((now - t0) / dur, 0, 1);
    var e = p < .5 ? 2*p*p : 1 - Math.pow(-2*p+2, 2)/2;
    ball.x = from.x + (to.x - from.x) * e;
    ball.y = from.y + (to.y - from.y) * e + (peak - Math.min(from.y,to.y)) * 4 * e * (1 - e);
    applyBall();
    if(p < 1) requestAnimationFrame(step);
    else if(cb) cb();
  }
  requestAnimationFrame(step);
}
function dropBall(){
  stopMove();
  var s = sceneSize();
  ball.x = s.w * (0.06 + Math.random()*0.88);   // 扩张：整个地板宽度
  ball.groundY = s.h * (0.54 + Math.random()*0.38); // 扩张：整个地板深度
  ball.y = ball.groundY;
  ball.size = 56;
  ball.mode = "rally";
  ball.knockN = 0;
  ball.el.style.width = ball.size + "px";
  ball.el.style.height = ball.size + "px";
  applyBall();
  ball.el.classList.add("toy-drop");
  setTimeout(function(){ ball.el.classList.remove("toy-drop"); }, 600);
  aiSay("ballDrop");
}
function ballToDog(){
  if(ball.busy) return;
  ball.busy = true;
  stopMove();
  var d = dogPos();
  aiSay("ballGo");
  flyBall({x:d.x, y:d.y - 40}, 620, function(){
    // 小狗顶回
    doJump();
    setTimeout(function(){
      var s = sceneSize();
      var target = {x: s.w * (0.06 + Math.random()*0.88), y: s.h * (0.54 + Math.random()*0.38)};
      flyBall(target, 700, function(){
        ball.busy = false;
        stats.energy = clamp(stats.energy - 2.5, 0, 100);
        stats.mood   = clamp(stats.mood + 4, 0, 100);
        stats.hunger = clamp(stats.hunger - 1, 0, 100);
        stats.clean  = clamp(stats.clean - 1, 0, 100);
        renderBars(); save();
        if(ball.mode === "rally") armSettle();
      });
    }, 500);
  });
}
function armSettle(){
  if(ball.settleT) clearTimeout(ball.settleT);
  ball.settleT = setTimeout(function(){
    if(ball.mode !== "rally" || ball.busy) return;
  aiSay("ballSettle");
    if(ball.el){ ball.el.remove(); ball.el = null; }   // 真正移除球，避免残留阻塞自主走动
    postActionIdle();
  }, 6000);
}
function chaseKnock(){
  var s = sceneSize();
  var tx = s.w * (0.06 + Math.random()*0.88);          // 横向全随机
  var tgy = s.h * (0.54 + Math.random()*0.38);         // 纵深全随机（小狗活动范围）
  var peakH = 30 + Math.random() * 50;
  var from = {x: ball.x, y: ball.y, gy: ball.groundY};
  var t0 = performance.now();
  function step(now){
    var p = clamp((now - t0) / 520, 0, 1);
    ball.x = from.x + (tx - from.x) * p;
    ball.y = ball.groundY - peakH * 4 * p * (1 - p);
    ball.groundY = from.gy + (tgy - from.gy) * p;      // 影子深度随球平滑过渡到新落点
    applyBall();
    if(p < 1) requestAnimationFrame(step);
    else { ball.knockN++; chaseStep(); }
  }
  requestAnimationFrame(step);
}
function chaseStep(){
  if(ball.mode !== "chase") return;
  if(ball.knockN >= 6){ endChase(); return; }
  stopMove();
  startMove(ball.x, ball.groundY, "run");   // 狗追到球的深度位置，视觉更贴近球
  if(state.act !== "run") doRun();
}
function endChase(){
  ball.mode = "idle";
  stopMove();
  doIdle(true);
  stats.energy = clamp(stats.energy - 8, 0, 100);
  stats.mood   = clamp(stats.mood + 10, 0, 100);
  stats.hunger = clamp(stats.hunger - 3, 0, 100);
  stats.clean  = clamp(stats.clean - 3, 0, 100);
  renderBars(); save();
  aiSay("chaseEnd");
  postActionIdle();
  setTimeout(function(){ if(ball.el){ ball.el.remove(); ball.el = null; } }, 2600);   // 真正移除球，避免残留阻塞自主走动
}

/* ---------- 玩耍入口 ---------- */
function initPlay(){
  buildOptionGrid("playGrid", [
    {label:"小球", cls:"ico-ball", desc:"点击拍球 / 拖拽追球", letter:"球"},
    {label:"磨牙棒", cls:"ico-stick", desc:"咔嚓咔嚓", letter:"棒"}
  ], function(it){
    closeMask("maskPlay");
    if(it.label === "小球"){
      if(state.sleeping) wakeUp();
      stopMove();
      if(ball.el) ball.el.remove();
      ball.el = document.createElement("div");
      ball.el.className = "toy ball";
      var sh = document.createElement("div"); sh.className = "ball-shadow";
      ball.el.appendChild(sh);
      $("toyLayer").appendChild(ball.el);
      dropBall();
      armSettle();
      // 点击：拍向小狗
      ball.el.addEventListener("click", function(ev){
        ev.stopPropagation();
        if(ball.mode === "rally") ballToDog();
      });
      // 拖拽：小狗追球（区分点按与拖拽）
      var drag = null;
      ball.el.addEventListener("pointerdown", function(ev){
        if(ball.busy || ball.mode === "chase") return;
        if(ball.settleT){ clearTimeout(ball.settleT); ball.settleT = null; }
        drag = {id: ev.pointerId, moved:false};
        ball.el.setPointerCapture(ev.pointerId);
        ev.preventDefault();
      });
      ball.el.addEventListener("pointermove", function(ev){
        if(!drag || ev.pointerId !== drag.id) return;
        if(Math.abs(ev.movementX) + Math.abs(ev.movementY) > 2) drag.moved = true;
        var s = sceneSize();
        ball.x = clamp(ev.clientX - s.left, 20, s.w - 20);
        ball.y = clamp(ev.clientY - s.top, s.h*0.2, s.h*0.92);          // 扩张：允许拖到整个地板高度
        ball.groundY = clamp(ev.clientY - s.top, s.h*0.54, s.h*0.92);   // 扩张：地面跟随拖动深度
        applyBall();
      });
      ball.el.addEventListener("pointerup", function(ev){
        if(!drag || ev.pointerId !== drag.id) return;
        var moved = drag.moved;
        drag = null;
        if(!moved) return;           // 纯点按交给 click 拍球
        ball.mode = "chase";
        ball.knockN = 0;
        chaseStep();
      });
    } else {
      if(state.sleeping) wakeUp();
      stopMove();
      if(state.act === "chew"){ aiSay("chewBusy"); return; }
      if(ball.el){ ball.el.remove(); ball.el = null; }
      dropStick();
    }
  });
}

    ev.stopPropagation();
    var now = Date.now();
    if(now - petLast < 3500) return;      // 冷却 3.5 秒，防止连点刷心情
    petLast = now;
    if(state.sleeping) wakeUp();
    if(state.act === "chew"){             // 啃咬中只回应不打断
      stats.mood = clamp(stats.mood + 2, 0, 100);
      renderBars(); save();
      aiSay("pet");
      return;
    }
    stopMove();
    stats.mood = clamp(stats.mood + 4, 0, 100);
    renderBars(); save();
    aiSay("pet");
    setBreath(null);
    showFrames(["f-happy"]);              // 短暂展示开心表情作为抚摸反馈
    state.timers.push(setTimeout(function(){
      doIdle(true);
      scheduleRoam(900 + Math.random()*900);
    }, 1600));
  });
}

/* ---------- 数值流逝 ---------- */
function tickDecay(){
  stats.hunger = clamp(stats.hunger - DECAY_PER_SEC, 0, 100);
  stats.clean  = clamp(stats.clean  - DECAY_PER_SEC, 0, 100);
  stats.mood   = clamp(stats.mood   - DECAY_PER_SEC, 0, 100);
  stats.energy = clamp(stats.energy - DECAY_PER_SEC, 0, 100);
  var low = stats.hunger < STAT_MIN || stats.clean < STAT_MIN || stats.mood < STAT_MIN || stats.energy < STAT_MIN;
  stats.health = clamp(stats.health + (low ? -HEALTH_DROP : HEALTH_REGEN), 0, 100);
  if(state.sleeping) stats.energy = clamp(stats.energy + 0.8, 0, 100);
  else if(state.act === "lie") stats.energy = clamp(stats.energy + 0.15, 0, 100); // 趴下待机也缓慢回精力
  checkAutoSleep();
  renderBars();
}

var THEMES = [
  {id:"sky",   name:"蓝墙米地", css:"linear-gradient(135deg,#A9C9E6 0%,#F7E3BA 100%)"},
  {id:"pink",  name:"粉色小屋", css:"linear-gradient(135deg,#F4B8D0 0%,#F8E2E6 100%)"},

  {id:"dusk",  name:"暖橙黄昏", css:"linear-gradient(135deg,#F3C4A5 0%,#F6D3AC 100%)"},
  {id:"starry",name:"星空之夜", css:"linear-gradient(135deg,#18234A 0%,#454A6B 100%)"}
];
function applyTheme(){
  $("scene").setAttribute("data-theme", S.theme || "sky");
  var row = $("themeRow");
  Array.prototype.forEach.call(row.children, function(el){
    el.classList.toggle("on", el.dataset.theme === (S.theme || "sky"));
  });
  syncStars();
}
/* 星空主题：在墙壁上生成/移除闪烁星星 */
function syncStars(){
  var wall = $("scene").querySelector(".wall");
  var stars = wall.querySelectorAll(".star");
  var starry = (S.theme || "sky") === "starry";
  if(starry && stars.length === 0){
    for(var i = 0; i < 36; i++){
      var s = document.createElement("div");
      s.className = "star";
      s.style.left = (2 + Math.random()*96).toFixed(1) + "%";
      s.style.top = (2 + Math.random()*86).toFixed(1) + "%";
      var sz = (1.5 + Math.random()*2.6).toFixed(1);
      s.style.width = sz + "px"; s.style.height = sz + "px";
      s.style.animationDuration = (1.3 + Math.random()*2.4).toFixed(2) + "s";
      s.style.animationDelay = (-Math.random()*3.5).toFixed(2) + "s";
      wall.appendChild(s);
    }
  } else if(!starry && stars.length){
    Array.prototype.forEach.call(stars, function(x){ x.remove(); });
  }
}
function buildThemeRow(){
  var row = $("themeRow"); row.innerHTML = "";
  THEMES.forEach(function(t){
    var s = document.createElement("div");
    s.className = "theme-swatch";
    s.dataset.theme = t.id;
    s.title = t.name;
    s.style.background = t.css;
    s.addEventListener("click", function(){
      S.theme = t.id; save(); applyTheme();
    });
    row.appendChild(s);
  });
  applyTheme();
}

    if(v === "happybirthday"){
      $("redeemInput").value = "";
      $("redeemInput").placeholder = "输入兑换码";
      openMask("maskLetter");
    } else {
      $("redeemInput").value = "";
      $("redeemInput").placeholder = "兑换码不正确，再试试";
    }
  });
  $("maskLetter").addEventListener("click", function(e){
    if(e.target === this) closeMask("maskLetter");
  });
}
/* 重置整个游戏：清存档并回到标题页重新领养。
   直接在内存中重置所有状态并切换视图，不依赖页面刷新——避免打包环境下
   localStorage 删除与重载的竞态导致刷新后仍回到小狗页面。 */
function doReset(){
  $("resetBtn").textContent = "重置游戏";
  resetStep = 0;
  localStorage.removeItem(LS_KEY);
  try{ sessionStorage.clear(); }catch(e){}
  clearTimers();
  stopMove();
  if(state.roamT){ clearTimeout(state.roamT); state.roamT = null; }
  if(state.bubbleTimer){ clearTimeout(state.bubbleTimer); state.bubbleTimer = null; }
  state.act = "idle"; state.expr = "happy";
  state.sleeping = false; state.ballMode = null; state.ballBusy = false;
  state.saveTimer = null; state.wakeGrace = 0;
  stats = { hunger:100, clean:100, mood:100, energy:100, health:100, dog:"samoyed" };
  S = { dog:"samoyed", stats:{hunger:100,clean:100,mood:100,energy:100,health:100},
        lastSeen:Date.now(), firstSeen:true, ageDays:0, name:"", theme:"sky" };
  $("toyLayer").innerHTML = "";
  ball.el = null; ball.busy = false; ball.settleT = null; ball.knockN = 0;
  document.querySelectorAll(".mask").forEach(function(m){ m.classList.remove("on"); });
  $("sleepHint").style.display = "none";
  $("scene").removeEventListener("click", wakeOnce);
  var bub = $("bubble"); bub.classList.remove("show");
  if(bgm){ try{ bgm.pause(); bgm.currentTime = 0; bgmOn = false; }catch(e){} }
  showView("view-logo");
}

/* ---------- 启动 ---------- */
function start(){
  load();
  if(location.hash === "#demo"){ S.firstSeen = false; stats.dog = stats.dog || "samoyed"; }
  buildSelect();
  initRouting();
  initFeed(); initBath(); initPlay();
  initName();
  mergeNewLines();
  initChat();
  initBgm();
  initPet();
  initSet();
  document.querySelectorAll(".mask .close").forEach(function(c){
    c.addEventListener("click", function(){ closeMask(c.dataset.close); });
  });
  $("btnFeed").addEventListener("click", function(){ openMask("maskFeed"); });
  $("btnBath").addEventListener("click", function(){ openMask("maskBath"); });
  $("btnPlay").addEventListener("click", function(){ openMask("maskPlay"); });

  setInterval(tickDecay, 1000);
  setInterval(function(){ save(); }, 10000);
  setInterval(function(){
    if(!$("view-main").classList.contains("on")) return;
    if(state.act === "idle" && !state.sleeping && Math.random() < .5) autoBark();
  }, 26000);
  /* 看门狗：每 2 秒兜底"贴图在走但位置已停"的残留踏步态，条件允许时恢复自主移动 */
  setInterval(function(){
    if(!$("view-main").classList.contains("on")) return;
    if((state.act === "walk" || state.act === "run") && !move.on){
      doIdle(true);
      if(!state.sleeping && !$("toyLayer").children.length && !document.querySelector(".mask.on")){
        scheduleRoam(200 + Math.random()*400);
      }
    }
  }, 2000);
  document.addEventListener("visibilitychange", function(){
    if(document.hidden) save();
    else {
      /* 切回前台只刷新数值与界面，不重置小狗位置与动作（位置已随 save 存档） */
      load(); renderBars(); renderAvatar();
    }
  });

  if(S.firstSeen){
    showView("view-logo");
  } else {
    enterFlow();
  }
}
start();
if("serviceWorker" in navigator){
  navigator.serviceWorker.register("sw.js").catch(function(){ /* file:// 或不可用环境自动跳过 */ });
}
